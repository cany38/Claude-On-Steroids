# Deploy once, from this folder, with your own Cloudflare account (free plan is enough):
#   npx wrangler login
#   npx wrangler deploy
# wrangler prints https://cos-relay.<your-subdomain>.workers.dev ; put that address in
# DEFAULT_RELAY_URL in src/config.mjs. Users of the app then need nothing.
name = "cos-relay"
main = "worker.mjs"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
